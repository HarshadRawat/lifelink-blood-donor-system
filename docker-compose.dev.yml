# ====================================================================
# LifeLink - Docker Compose Development Overlay (Hot Reloading)
# ====================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ====================================================================

services:
  backend:
    environment:
      JPA_SHOW_SQL: "true"
      SECURITY_LOG_LEVEL: "DEBUG"

  frontend:
    # Overrides production Nginx container with Vite development server
    build:
      context: ./blood-donor-system/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./blood-donor-system/frontend/src:/app/src
      - ./blood-donor-system/frontend/public:/app/public
      - ./blood-donor-system/frontend/index.html:/app/index.html
