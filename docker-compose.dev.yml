# ====================================================================
# LifeLink - Docker Compose Development Overlay (Developer Ports & Hot Reload)
# ====================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ====================================================================

services:
  mysql:
    ports:
      - "${MYSQL_PORT:-3307}:3306"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  rabbitmq:
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"

  backend:
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      JPA_SHOW_SQL: "true"
      SECURITY_LOG_LEVEL: "DEBUG"
      SPRING_PROFILES_ACTIVE: "prod,demo"
      DEMO_SEED_ENABLED: "true"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@lifelink.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-AdminSecret123!}"

  frontend:
    # Overrides production Nginx container with Vite development server
    build:
      context: ./blood-donor-system/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./blood-donor-system/frontend/src:/app/src
      - ./blood-donor-system/frontend/public:/app/public
      - ./blood-donor-system/frontend/index.html:/app/index.html
