services:
  # Backend Spring Boot Web Service
  - type: web
    name: lifelink-backend
    runtime: docker
    dockerfilePath: ./blood-donor-system/Dockerfile
    dockerContext: ./blood-donor-system
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod,demo
      - key: DB_URL
        fromDatabase:
          name: lifelink-mysql
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: lifelink-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: lifelink-mysql
          property: password
      - key: JPA_DDL_AUTO
        value: validate
      - key: FLYWAY_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,https://*.netlify.app,https://*.onrender.com,http://localhost:5173"
      - key: ADMIN_EMAIL
        value: admin@lifelink.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: "6379"

databases:
  - name: lifelink-mysql
    plan: free
    databaseName: blood_donor_system
