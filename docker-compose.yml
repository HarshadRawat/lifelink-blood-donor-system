# ====================================================================
# LifeLink - Enterprise Docker Compose Orchestration
# ====================================================================
# Usage:
#   Full Stack:         docker compose up -d --build
#   Only Database:      docker compose up -d mysql
#   View Logs:          docker compose logs -f [service]
#   Stop Services:      docker compose down
#   Stop & Wipe Data:   docker compose down -v
# ====================================================================

services:
  # ------------------------------------------------------------------
  # 1. MySQL 8.0 Database Service
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: lifelink-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: blood_donor_system
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${DB_USER:-lifelink_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lifelink_secret}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lifelink-network

  # ------------------------------------------------------------------
  # 2. Spring Boot Backend Service (REST API & WebSockets)
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./blood-donor-system
      dockerfile: Dockerfile
    container_name: lifelink-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/blood_donor_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      JWT_SECRET: ${JWT_SECRET:-blood_donor_super_secret_jwt_key_minimum_32_characters_long}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SECURITY_LOG_LEVEL: ${SECURITY_LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v3/api-docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - lifelink-network

  # ------------------------------------------------------------------
  # 3. React Frontend & Nginx Gateway Service
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./blood-donor-system/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: lifelink-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - lifelink-network

# --------------------------------------------------------------------
# Persistent Named Volumes
# --------------------------------------------------------------------
volumes:
  mysql_data:
    name: lifelink_mysql_data

# --------------------------------------------------------------------
# Network Configuration
# --------------------------------------------------------------------
networks:
  lifelink-network:
    name: lifelink-network
    driver: bridge
