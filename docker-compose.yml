# ====================================================================
# LifeLink - Production Docker Compose Orchestration
# ====================================================================
# Usage:
#   Production:        docker compose up -d --build
#   With Demo Data:    docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
#   Local Dev Overlay: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ====================================================================

services:
  # ------------------------------------------------------------------
  # 1. MySQL 8.0 Database Service
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: lifelink-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: blood_donor_system
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_USER: ${DB_USER:-lifelink_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - lifelink-network

  # ------------------------------------------------------------------
  # 2. Redis 7 In-Memory Cache & Rate Limiting Service
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: lifelink-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - lifelink-network

  # ------------------------------------------------------------------
  # 3. RabbitMQ 3 Message Broker Service (Task 7)
  # ------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lifelink-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-lifelink_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - lifelink-network

  # ------------------------------------------------------------------
  # 4. Spring Boot Backend Service (REST API & WebSockets)
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./blood-donor-system
      dockerfile: Dockerfile
    container_name: lifelink-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:mysql://mysql:3306/blood_donor_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USER:-lifelink_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-lifelink_mq}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:3000,http://127.0.0.1:5173}
      RATE_LIMIT_TRUSTED_PROXIES: 172.28.0.0/16,127.0.0.1,::1
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      SECURITY_LOG_LEVEL: ${SECURITY_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - lifelink-network

  # ------------------------------------------------------------------
  # 5. React Frontend & Nginx Gateway Service
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./blood-donor-system/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    container_name: lifelink-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - lifelink-network

# --------------------------------------------------------------------
# Persistent Named Volumes
# --------------------------------------------------------------------
volumes:
  mysql_data:
    name: lifelink_mysql_data
  redis_data:
    name: lifelink_redis_data
  rabbitmq_data:
    name: lifelink_rabbitmq_data

# --------------------------------------------------------------------
# Network Configuration
# --------------------------------------------------------------------
networks:
  lifelink-network:
    name: lifelink-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
