spring.application.name=blood-donor-system

server.port=${PORT:8080}

# Database Connection (Environment variables override local defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blood_donor_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sabby3924}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:my-super-secret-key-for-blood-donor-system-12345}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}