# ====================================================================
# LifeLink Production Profile Configuration
# ====================================================================

# Strict Schema Validation under Flyway versioning
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Security & Error sanitization (never leak stacktraces in production)
server.error.include-stacktrace=never
server.error.include-message=always

# Actuator: expose health and info only, restrict internal details
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Rate Limiting: 10 requests per 60s per IP on auth endpoints
security.rate-limit.enabled=true
security.rate-limit.login.max-requests=10
security.rate-limit.login.window-seconds=60

# Distributed Rate Limiting & Caching via Redis
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

