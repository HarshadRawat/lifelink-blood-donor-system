# ====================================================================
# LifeLink In-Memory H2 Test Configuration
# Provides zero-dependency isolated database execution for test suites & CI/CD
# ====================================================================

spring.datasource.url=jdbc:h2:mem:blood_donor_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway disabled for in-memory H2 tests (enabled for MySQL in production, and for Testcontainers in Task 3)
spring.flyway.enabled=false

jwt.secret=test-super-secret-key-for-blood-donor-system-12345
jwt.expiration-ms=86400000

logging.level.org.springframework.security=WARN

