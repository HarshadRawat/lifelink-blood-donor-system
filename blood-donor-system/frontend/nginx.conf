# ====================================================================
# LifeLink - Production Nginx Reverse Proxy & Static File Server
# ====================================================================

# Upstream backend service defined in Docker network
upstream backend_service {
    server backend:8080;
    keepalive 32;
}

# WebSocket upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------------
    # High-Performance Gzip Compression
    # ----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ----------------------------------------------------------------
    # Enterprise Security Headers
    # ----------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----------------------------------------------------------------
    # Single Page Application (SPA) Client-Side Routing
    # ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ensure index.html is never cached so UI updates reflect immediately
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Fingerprinted static assets cached for 1 year
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ----------------------------------------------------------------
    # Backend REST API Proxy (/api/*)
    # ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard gateway timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ----------------------------------------------------------------
    # Real-Time WebSocket Proxy for STOMP Push Notifications (/ws)
    # ----------------------------------------------------------------
    location /ws {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive for sustained WebSocket communication
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ----------------------------------------------------------------
    # OpenAPI & Swagger UI Documentation Proxy
    # ----------------------------------------------------------------
    location /v3/api-docs {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
    }

    location /swagger-ui.html {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
    }

    # ----------------------------------------------------------------
    # Container Health Check Probe
    # ----------------------------------------------------------------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
