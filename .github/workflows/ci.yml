name: LifeLink CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. Backend Build, Unit Tests & Packaging
  # ------------------------------------------------------------------
  backend-ci:
    name: Backend Build & Tests (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw
        working-directory: blood-donor-system

      - name: Run Backend Tests & Coverage
        run: ./mvnw clean test
        working-directory: blood-donor-system

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: blood-donor-system/target/site/jacoco/

      - name: Package Executable JAR
        run: ./mvnw package -DskipTests
        working-directory: blood-donor-system

  # ------------------------------------------------------------------
  # 2. Frontend Lint & Production Distribution Build
  # ------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint & Build (Node 22 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: blood-donor-system/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: blood-donor-system/frontend

      - name: Run ESLint Verification
        run: npm run lint
        working-directory: blood-donor-system/frontend

      - name: Run Frontend Unit Tests
        run: npm test
        working-directory: blood-donor-system/frontend

      - name: Build Optimized Production Bundle
        run: npm run build
        working-directory: blood-donor-system/frontend

  # ------------------------------------------------------------------
  # 3. Docker Orchestration & Image Verification
  # ------------------------------------------------------------------
  docker-validation:
    name: Docker Containerization Verification
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Production Docker Compose Config
        run: docker compose config

      - name: Validate Development Docker Compose Config
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config

      - name: Build Docker Container Images
        run: docker compose build

  # ------------------------------------------------------------------
  # 4. Container Publishing to GitHub Container Registry (ghcr.io)
  # ------------------------------------------------------------------
  publish:
    name: Publish Container Images to GHCR
    needs: [docker-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Lowercase Image Prefix
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./blood-donor-system
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/lifelink-backend:latest
            ${{ env.IMAGE_PREFIX }}/lifelink-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./blood-donor-system/frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/lifelink-frontend:latest
            ${{ env.IMAGE_PREFIX }}/lifelink-frontend:${{ github.sha }}


